<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分形漫游树 · 3D 实验（版本 B）</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #05070f; color: #e8ecf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    canvas { display: block; }

    .panel {
      position: fixed; z-index: 10;
      background: rgba(14, 18, 30, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      font-size: 12px; line-height: 1.6;
    }

    #info { top: 16px; left: 16px; padding: 12px 16px; min-width: 246px; }
    #info h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    #info .sub { color: #8b96ad; font-size: 11px; margin-bottom: 8px; }

    #tree-select {
      width: 100%; margin-bottom: 9px; padding: 5px 8px;
      color: #cfd8ea; background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px; font-size: 11.5px; font-family: inherit;
      cursor: pointer; outline: none;
    }
    #tree-select option { background: #10141f; color: #cfd8ea; }
    #info .row { display: flex; justify-content: space-between; gap: 16px; }
    #info .row span:first-child { color: #8b96ad; }
    #info .row span:last-child { font-variant-numeric: tabular-nums; color: #cfd8ea; }

    #controls { top: 16px; right: 16px; padding: 12px 16px; width: 232px; }
    #controls h2 {
      margin: 0 0 10px; font-size: 12px; font-weight: 600;
      color: #8b96ad; text-transform: uppercase; letter-spacing: .08em;
    }
    .field { margin-bottom: 11px; }
    .field label {
      display: flex; justify-content: space-between;
      margin-bottom: 4px; color: #9aa5bd; font-size: 11px;
    }
    .field label b { color: #6ea8fe; font-weight: 600; font-variant-numeric: tabular-nums; }
    .field input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.16); outline: none; cursor: pointer;
    }
    .field input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 13px; height: 13px; border-radius: 50%;
      background: #6ea8fe; cursor: pointer;
      box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.22);
    }
    .field input[type=range]::-moz-range-thumb {
      width: 13px; height: 13px; border: none; border-radius: 50%;
      background: #6ea8fe; cursor: pointer;
    }
    .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .toggles button {
      flex: 1 1 auto; padding: 5px 9px; font-size: 11px;
      color: #cfd8ea; background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px; cursor: pointer; white-space: nowrap;
      font-family: inherit; transition: background .15s, border-color .15s;
    }
    .toggles button:hover { background: rgba(110, 168, 254, 0.18); border-color: rgba(110, 168, 254, .5); }
    .toggles button.on { background: rgba(110, 168, 254, 0.3); border-color: #6ea8fe; color: #fff; }

    #hint {
      bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 7px 16px; color: #8b96ad; font-size: 11px;
      white-space: nowrap;
    }
    #hint b { color: #cfd8ea; font-weight: 500; }

    #dropping {
      position: fixed; inset: 0; z-index: 25; display: none;
      align-items: center; justify-content: center;
      background: rgba(6, 10, 22, 0.84);
      box-shadow: inset 0 0 0 2px rgba(110, 168, 254, 0.55);
      color: #6ea8fe; font-size: 17px; letter-spacing: .02em;
    }
    body.dragging #dropping { display: flex; }

    #loading {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      background: #05070f; color: #8b96ad; font-size: 13px;
      transition: opacity .5s ease;
    }
    #loading.gone { opacity: 0; pointer-events: none; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(110, 168, 254, 0.2);
      border-top-color: #6ea8fe;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><div id="loading-text">正在载入演化树…</div></div>

  <div id="info" class="panel">
    <select id="tree-select" title="切换演化树"></select>
    <h1 id="tree-title">—</h1>
    <div class="sub" id="tree-uid">—</div>
    <div class="row"><span>节点</span><span id="stat-nodes">—</span></div>
    <div class="row"><span>叶 / 最深</span><span id="stat-leaves">—</span></div>
    <div class="row"><span>绘制的枝</span><span id="stat-segments">—</span></div>
    <div class="row"><span>半径跨度</span><span id="stat-radius">—</span></div>
    <div class="row"><span>帧率</span><span id="stat-fps">—</span></div>
  </div>

  <div id="dropping">松手即载入这棵树</div>

  <div id="controls" class="panel">
    <h2>参数</h2>
    <div class="field">
      <label>每层半径倍率 K <b id="v-growth">1.08</b></label>
      <input type="range" id="r-growth" min="1.01" max="1.30" step="0.005" value="1.08" />
    </div>
    <div class="field">
      <label>自相似度 <b id="v-expo">0.85</b></label>
      <input type="range" id="r-expo" min="0.35" max="1" step="0.01" value="0.85" />
    </div>
    <div class="field">
      <label>节点大小 <b id="v-node">0.020</b></label>
      <input type="range" id="r-node" min="0.002" max="0.08" step="0.001" value="0.02" />
    </div>
    <div class="field">
      <label>根锥角 <b id="v-spread">180°</b></label>
      <input type="range" id="r-spread" min="30" max="180" step="1" value="90" />
    </div>
    <div class="field">
      <label>展开深度 <b id="v-depth">全部</b></label>
      <input type="range" id="r-depth" min="1" max="107" step="1" value="107" />
    </div>
    <div class="toggles">
      <button id="b-frame" class="on">自动取景</button>
      <button id="b-scene" class="on">海与天</button>
      <button id="b-spin">自动旋转</button>
    </div>
  </div>

  <div id="hint" class="panel">
    <b>拖拽</b> 旋转 &nbsp;·&nbsp; <b>滚轮</b> 缩放进出 &nbsp;·&nbsp; <b>右键</b> 平移 &nbsp;·&nbsp;
    <b>拖入 json</b> 换任意一棵树
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
